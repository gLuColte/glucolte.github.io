<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Query rewriting, expansion, decomposition, and failure</title>
  <desc id="desc">The short production instance question is rewritten and expanded for retrieval. A combined question is decomposed into runbook retrieval and an API call. A bad rewrite loses negation and changes operational intent.</desc>
  <style>.t{font:700 21px system-ui,sans-serif;fill:#0f172a}.h{font:700 15px system-ui,sans-serif;fill:#0f172a}.x{font:13px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:700 13px system-ui,sans-serif;fill:#0f172a}</style>
  <rect width="1000" height="590" rx="14" fill="#fff"/><rect x="18" y="18" width="964" height="554" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="54" class="t">Query processing changes the retrieval request—trace and evaluate it</text>
  <rect x="42" y="85" width="430" height="205" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="62" y="114" class="h">Rewrite + expand</text><text x="62" y="148" class="x">Original: “What about the production instance?”</text><text x="250" y="178" class="m">↓ rewrite</text><text x="62" y="207" class="x">“What is the current production EC2 high-CPU</text><text x="62" y="226" class="x">triage procedure?”</text><text x="62" y="260" class="s">Expansion: production EC2 · high CPU · CPU saturation ·</text><text x="62" y="278" class="s">CloudWatch process inspection</text>
  <rect x="500" y="85" width="458" height="205" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="520" y="114" class="h">Decompose knowledge from live state</text><text x="520" y="148" class="x">“What should I do and what is instance i-123 doing now?”</text><line x1="729" y1="167" x2="620" y2="199" stroke="#64748b"/><line x1="729" y1="167" x2="843" y2="199" stroke="#64748b"/><rect x="530" y="199" width="184" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="546" y="224" class="m">Retrieval query</text><text x="546" y="244" class="s">current EC2 runbook</text><rect x="746" y="199" width="184" height="58" rx="6" fill="#ecfdf5" stroke="#86efac"/><text x="762" y="224" class="m">Tool/API query</text><text x="762" y="244" class="s">CloudWatch for i-123</text>
  <rect x="42" y="318" width="916" height="190" rx="9" fill="#fff7ed" stroke="#fdba74"/><text x="62" y="348" class="h">Failure: lost negation changes the intended retrieval</text><text x="62" y="382" class="x">Original: “Do not restart the instance.”</text><text x="62" y="414" class="x">Bad rewrite: “How do I restart the instance?”</text><line x1="61" y1="425" x2="387" y2="425" stroke="#dc2626" stroke-width="2"/><text x="62" y="455" class="m">→ safety-critical intent changed; evaluate rewrites independently from retrieval.</text><text x="62" y="482" class="s">Keep the original query for audit and exact matching; bound expansions and subqueries.</text>
</svg>
