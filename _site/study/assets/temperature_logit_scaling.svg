<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Temperature rescales logits before softmax</title>
  <desc id="description">A diagram showing the relative logits for Paris, Lyon, Marseille, Berlin, and Rome, then the same logits divided by temperature 0.5. The values remain logits, not probabilities.</desc>

  <rect width="900" height="500" rx="18" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Temperature rescales logits before softmax</text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">At T = 0.5, each relative logit is divided by 0.5. These numbers are still scores, not probabilities.</text>

  <rect x="70" y="104" width="330" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="235" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Raw relative logits</text>
  <text x="235" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Before temperature scaling</text>

  <rect x="500" y="104" width="330" height="300" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="665" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Adjusted logits</text>
  <text x="665" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Each raw logit ÷ 0.5</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <text x="108" y="205" fill="#334155">Paris</text><text x="360" y="205" text-anchor="end" fill="#1d4ed8" font-weight="700">-0.693</text>
    <text x="108" y="245" fill="#334155">Lyon</text><text x="360" y="245" text-anchor="end" fill="#1d4ed8" font-weight="700">-1.386</text>
    <text x="108" y="285" fill="#334155">Marseille</text><text x="360" y="285" text-anchor="end" fill="#1d4ed8" font-weight="700">-1.897</text>
    <text x="108" y="325" fill="#334155">Berlin</text><text x="360" y="325" text-anchor="end" fill="#1d4ed8" font-weight="700">-2.659</text>
    <text x="108" y="365" fill="#334155">Rome</text><text x="360" y="365" text-anchor="end" fill="#1d4ed8" font-weight="700">-3.507</text>

    <text x="538" y="205" fill="#334155">Paris</text><text x="790" y="205" text-anchor="end" fill="#c2410c" font-weight="700">-1.386</text>
    <text x="538" y="245" fill="#334155">Lyon</text><text x="790" y="245" text-anchor="end" fill="#c2410c" font-weight="700">-2.772</text>
    <text x="538" y="285" fill="#334155">Marseille</text><text x="790" y="285" text-anchor="end" fill="#c2410c" font-weight="700">-3.794</text>
    <text x="538" y="325" fill="#334155">Berlin</text><text x="790" y="325" text-anchor="end" fill="#c2410c" font-weight="700">-5.318</text>
    <text x="538" y="365" fill="#334155">Rome</text><text x="790" y="365" text-anchor="end" fill="#c2410c" font-weight="700">-7.014</text>
  </g>

  <path d="M414 254 H482" stroke="#64748b" stroke-width="3"/>
  <path d="M473 246 L485 254 L473 262" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="397" y="212" width="102" height="31" rx="15" fill="#e2e8f0"/>
  <text x="448" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">÷ T = 0.5</text>

  <rect x="105" y="431" width="690" height="43" rx="9" fill="#e2e8f0"/>
  <text x="450" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Next: Stage 7 applies softmax to convert the adjusted logits into probabilities.</text>
</svg>
