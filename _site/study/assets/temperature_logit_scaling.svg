<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="500" viewBox="0 0 1300 500" role="img" aria-labelledby="title description">
  <title id="title">Temperature rescales logits before softmax</title>
  <desc id="description">Five-panel diagram comparing raw logits with the same logits divided by temperatures 1.2, 0.9, 0.5, and 0.1. Every panel contains logits, not probabilities.</desc>
  <rect width="1300" height="500" rx="18" fill="#f8fafc"/>
  <text x="650" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Temperature rescales logits before softmax</text>
  <text x="650" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Each panel shows the same raw scores divided by T. They are still logits—not probabilities.</text>

  <g font-family="Arial, sans-serif">
    <rect x="15" y="100" width="235" height="305" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="132" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Raw logits</text><text x="132" y="158" text-anchor="middle" font-size="14" fill="#475569">Before temperature</text>
    <rect x="270" y="100" width="235" height="305" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="387" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">T = 1.2</text><text x="387" y="158" text-anchor="middle" font-size="14" fill="#475569">Raw logit ÷ 1.2</text>
    <rect x="525" y="100" width="235" height="305" rx="12" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/><text x="642" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">T = 0.9</text><text x="642" y="158" text-anchor="middle" font-size="14" fill="#475569">Raw logit ÷ 0.9</text>
    <rect x="780" y="100" width="235" height="305" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="897" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">T = 0.5</text><text x="897" y="158" text-anchor="middle" font-size="14" fill="#475569">Raw logit ÷ 0.5</text>
    <rect x="1035" y="100" width="235" height="305" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="1152" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#7e22ce">T = 0.1</text><text x="1152" y="158" text-anchor="middle" font-size="14" fill="#475569">Raw logit ÷ 0.1</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <text x="37" y="204">Paris</text><text x="37" y="244">Lyon</text><text x="37" y="284">Marseille</text><text x="37" y="324">Berlin</text><text x="37" y="364">Rome</text>
    <text x="292" y="204">Paris</text><text x="292" y="244">Lyon</text><text x="292" y="284">Marseille</text><text x="292" y="324">Berlin</text><text x="292" y="364">Rome</text>
    <text x="547" y="204">Paris</text><text x="547" y="244">Lyon</text><text x="547" y="284">Marseille</text><text x="547" y="324">Berlin</text><text x="547" y="364">Rome</text>
    <text x="802" y="204">Paris</text><text x="802" y="244">Lyon</text><text x="802" y="284">Marseille</text><text x="802" y="324">Berlin</text><text x="802" y="364">Rome</text>
    <text x="1057" y="204">Paris</text><text x="1057" y="244">Lyon</text><text x="1057" y="284">Marseille</text><text x="1057" y="324">Berlin</text><text x="1057" y="364">Rome</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="end" font-weight="700">
    <text x="228" y="204" fill="#475569">-0.693</text><text x="228" y="244" fill="#475569">-1.386</text><text x="228" y="284" fill="#475569">-1.897</text><text x="228" y="324" fill="#475569">-2.659</text><text x="228" y="364" fill="#475569">-3.507</text>
    <text x="483" y="204" fill="#2563eb">-0.578</text><text x="483" y="244" fill="#2563eb">-1.155</text><text x="483" y="284" fill="#2563eb">-1.581</text><text x="483" y="324" fill="#2563eb">-2.216</text><text x="483" y="364" fill="#2563eb">-2.923</text>
    <text x="738" y="204" fill="#0f766e">-0.770</text><text x="738" y="244" fill="#0f766e">-1.540</text><text x="738" y="284" fill="#0f766e">-2.108</text><text x="738" y="324" fill="#0f766e">-2.954</text><text x="738" y="364" fill="#0f766e">-3.897</text>
    <text x="993" y="204" fill="#c2410c">-1.386</text><text x="993" y="244" fill="#c2410c">-2.772</text><text x="993" y="284" fill="#c2410c">-3.794</text><text x="993" y="324" fill="#c2410c">-5.318</text><text x="993" y="364" fill="#c2410c">-7.014</text>
    <text x="1248" y="204" fill="#7e22ce">-6.930</text><text x="1248" y="244" fill="#7e22ce">-13.860</text><text x="1248" y="284" fill="#7e22ce">-18.970</text><text x="1248" y="324" fill="#7e22ce">-26.590</text><text x="1248" y="364" fill="#7e22ce">-35.070</text>
  </g>
  <rect x="195" y="430" width="910" height="44" rx="9" fill="#e2e8f0"/>
  <text x="650" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Higher T moves scores closer together; lower T spreads them farther apart. Stage 7 applies softmax next.</text>
</svg>
