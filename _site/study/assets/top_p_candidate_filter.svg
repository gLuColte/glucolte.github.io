<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">How temperature changes the Top-p candidate set</title>
  <desc id="description">Four colour-coded rows show Top-p 0.8 after temperatures 1.2, 0.9, 0.5, and 0.1. Temperatures 1.2 and 0.9 retain Paris, Lyon, and Marseille; temperature 0.5 retains Paris and Lyon; temperature 0.1 retains Paris alone.</desc>
  <rect width="1000" height="620" rx="18" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">The same Top-p = 0.8 can keep different candidates</text>
  <text x="500" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Temperature changes the probability distribution first; Top-p then filters that colour-coded distribution.</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="98" width="856" height="95" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="105" y="136" font-size="18" font-weight="700" fill="#2563eb">T = 1.2</text><text x="105" y="162" font-size="14" fill="#475569">45.1% + 25.3% + 16.5% = 86.9%</text><text x="105" y="181" font-size="13" font-weight="700" fill="#2563eb">Top-p crosses 80% after Marseille</text><rect x="445" y="118" width="410" height="54" rx="27" fill="#3b82f6"/><text x="650" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="white">KEEP: Paris · Lyon · Marseille</text>
    <rect x="72" y="207" width="856" height="95" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="105" y="245" font-size="18" font-weight="700" fill="#0f766e">T = 0.9</text><text x="105" y="271" font-size="14" fill="#475569">53.2% + 24.6% + 13.9% = 91.7%</text><text x="105" y="290" font-size="13" font-weight="700" fill="#0f766e">Top-p crosses 80% after Marseille</text><rect x="445" y="227" width="410" height="54" rx="27" fill="#14b8a6"/><text x="650" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="white">KEEP: Paris · Lyon · Marseille</text>
    <rect x="72" y="316" width="856" height="95" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="105" y="354" font-size="18" font-weight="700" fill="#c2410c">T = 0.5</text><text x="105" y="380" font-size="14" fill="#475569">73.4% + 18.3% = 91.7%</text><text x="105" y="399" font-size="13" font-weight="700" fill="#c2410c">Top-p crosses 80% after Lyon</text><rect x="445" y="336" width="410" height="54" rx="27" fill="#f97316"/><text x="650" y="369" text-anchor="middle" font-size="17" font-weight="700" fill="white">KEEP: Paris · Lyon</text>
    <rect x="72" y="425" width="856" height="95" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text x="105" y="463" font-size="18" font-weight="700" fill="#7e22ce">T = 0.1</text><text x="105" y="489" font-size="14" fill="#475569">Paris alone = 99.9%</text><text x="105" y="508" font-size="13" font-weight="700" fill="#7e22ce">Top-p crosses 80% immediately</text><rect x="445" y="445" width="410" height="54" rx="27" fill="#8b5cf6"/><text x="650" y="478" text-anchor="middle" font-size="17" font-weight="700" fill="white">KEEP: Paris</text>
  </g>
  <rect x="72" y="556" width="856" height="38" rx="9" fill="#e2e8f0"/><text x="500" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Top-p does not reshape probabilities: it only keeps tokens until their cumulative probability reaches its threshold.</text>
</svg>
