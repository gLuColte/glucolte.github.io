<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Top-p candidate filtering at 0.8</title>
  <desc id="description">Top-p keeps Paris and Lyon because their cumulative probability reaches 91.7 percent, crossing the 80 percent threshold. Marseille, Berlin, and Rome are crossed out.</desc>

  <rect width="900" height="500" rx="18" fill="#f8fafc"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Top-p = 0.8 filters the candidate set</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Add probabilities from left to right until the running total reaches at least 80%.</text>

  <rect x="125" y="88" width="230" height="52" rx="9" fill="#d1fae5" stroke="#10b981"/>
  <text x="240" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">Paris: cumulative 73.4%</text>
  <text x="240" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#047857">Below 80% → keep going</text>
  <path d="M365 114 H405" stroke="#64748b" stroke-width="2"/>
  <path d="M398 108 L406 114 L398 120" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="415" y="88" width="280" height="52" rx="9" fill="#d1fae5" stroke="#10b981"/>
  <text x="555" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">+ Lyon: cumulative 91.7%</text>
  <text x="555" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#047857">80% crossed → include Lyon and stop</text>

  <line x1="100" y1="360" x2="800" y2="360" stroke="#94a3b8" stroke-width="1.5"/>

  <g>
    <rect x="132" y="176" width="56" height="184" rx="5" fill="#10b981"/>
    <rect x="272" y="314" width="56" height="46" rx="5" fill="#10b981"/>
    <rect x="412" y="343" width="56" height="17" rx="5" fill="#cbd5e1"/>
    <rect x="552" y="356" width="56" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="692" y="358" width="56" height="2" rx="1" fill="#cbd5e1"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="160" y="166" font-size="14" font-weight="700" fill="#047857">73.4%</text>
    <text x="300" y="304" font-size="14" font-weight="700" fill="#047857">18.3%</text>
    <text x="440" y="333" font-size="14" font-weight="700" fill="#64748b">6.6%</text>
    <text x="580" y="346" font-size="14" font-weight="700" fill="#64748b">1.4%</text>
    <text x="720" y="348" font-size="14" font-weight="700" fill="#64748b">0.3%</text>

    <text x="160" y="389" font-size="15" font-weight="700" fill="#334155">Paris</text>
    <text x="300" y="389" font-size="15" font-weight="700" fill="#334155">Lyon</text>
    <text x="440" y="389" font-size="15" font-weight="700" fill="#64748b">Marseille</text>
    <text x="580" y="389" font-size="15" font-weight="700" fill="#64748b">Berlin</text>
    <text x="720" y="389" font-size="15" font-weight="700" fill="#64748b">Rome</text>

    <text x="160" y="414" font-size="13" font-weight="700" fill="#047857">KEEP</text>
    <text x="300" y="414" font-size="13" font-weight="700" fill="#047857">KEEP + STOP</text>
    <text x="440" y="414" font-size="13" font-weight="700" fill="#b91c1c">EXCLUDED</text>
    <text x="580" y="414" font-size="13" font-weight="700" fill="#b91c1c">EXCLUDED</text>
    <text x="720" y="414" font-size="13" font-weight="700" fill="#b91c1c">EXCLUDED</text>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M414 276 L466 328 M466 276 L414 328"/>
    <path d="M554 276 L606 328 M606 276 L554 328"/>
    <path d="M694 276 L746 328 M746 276 L694 328"/>
  </g>

  <rect x="150" y="445" width="600" height="32" rx="7" fill="#e2e8f0"/>
  <text x="450" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Candidate set after Top-P: Paris and Lyon only</text>
</svg>
