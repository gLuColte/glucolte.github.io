<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Exact search and approximate nearest neighbour tradeoffs</title>
  <desc id="desc">Exact search examines every vector. Approximate nearest neighbour search visits likely neighbourhoods. Low versus high search effort changes latency, compute, and potential recall. An IVF cluster example shows probing one or three clusters.</desc>
  <style>.t{font:700 21px system-ui,sans-serif;fill:#0f172a}.h{font:700 15px system-ui,sans-serif;fill:#0f172a}.x{font:13px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:700 13px system-ui,sans-serif;fill:#0f172a}</style>
  <rect width="1000" height="590" rx="14" fill="#fff"/><rect x="18" y="18" width="964" height="554" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="54" class="t">ANN tuning trades candidate exploration for latency and compute</text>
  <rect x="42" y="82" width="430" height="168" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="62" y="111" class="h">Exact nearest-neighbour search</text><text x="62" y="144" class="x">Query → compare against every vector</text><text x="62" y="171" class="x">→ highest-recall reference</text><text x="62" y="198" class="x">→ expensive at scale</text><g fill="#2563eb"><circle cx="315" cy="139" r="6"/><circle cx="345" cy="163" r="6"/><circle cx="385" cy="130" r="6"/><circle cx="405" cy="198" r="6"/><circle cx="330" cy="208" r="6"/></g><circle cx="285" cy="180" r="8" fill="#16a34a"/>
  <rect x="500" y="82" width="458" height="168" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="520" y="111" class="h">Approximate nearest neighbour (ANN)</text><text x="520" y="144" class="x">Query → inspect likely neighbourhoods</text><text x="520" y="171" class="x">→ skip much of the index</text><text x="520" y="198" class="x">→ faster, may miss a true neighbour</text><circle cx="808" cy="165" r="64" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 6"/><circle cx="720" cy="180" r="8" fill="#16a34a"/><g fill="#94a3b8"><circle cx="764" cy="136" r="6"/><circle cx="803" cy="180" r="6"/><circle cx="846" cy="150" r="6"/><circle cx="879" cy="205" r="6"/><circle cx="858" cy="110" r="6"/></g>
  <rect x="42" y="278" width="430" height="120" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="62" y="307" class="h">HNSW-style search effort</text><text x="62" y="338" class="x">Low traversal effort: latency ↓ · compute ↓ · recall potentially ↓</text><text x="62" y="366" class="x">High traversal effort: latency ↑ · compute ↑ · recall potentially ↑</text>
  <rect x="500" y="278" width="458" height="250" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="520" y="307" class="h">IVF-style cluster probing</text>
  <rect x="530" y="332" width="78" height="54" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="553" y="364" class="m">EC2</text><rect x="622" y="332" width="78" height="54" rx="8" fill="#fef3c7" stroke="#fde68a"/><text x="648" y="364" class="m">RDS</text><rect x="714" y="332" width="78" height="54" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/><text x="740" y="364" class="m">IAM</text><rect x="806" y="332" width="78" height="54" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="833" y="364" class="m">S3</text>
  <text x="530" y="425" class="x">Probe 1 cluster → fast; may miss a neighbour in another cluster</text><text x="530" y="456" class="x">Probe 3 clusters → more work; better chance of relevant retrieval</text><text x="530" y="490" class="s">Measure Recall@K against an exact-search or golden-set reference.</text>
</svg>
