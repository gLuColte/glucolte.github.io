<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Reranking reorders an already retrieved candidate set</title>
  <desc id="desc">The broad first-stage retrieval ranks an irrelevant RDS CPU chunk above the EC2 owner approval policy. A reranker considering the exact EC2 question moves the EC2 procedural chunks higher. It cannot see a relevant document ranked below the initial Top K cutoff.</desc>
  <style>.t{font:700 21px system-ui,sans-serif;fill:#0f172a}.h{font:700 15px system-ui,sans-serif;fill:#0f172a}.x{font:13px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#475569}.ok{font:700 13px system-ui,sans-serif;fill:#15803d}.bad{font:700 13px system-ui,sans-serif;fill:#b91c1c}</style>
  <rect width="1000" height="430" rx="14" fill="#fff"/><rect x="18" y="18" width="964" height="394" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="54" class="t">Reranking changes order, not which documents were initially retrieved</text>
  <rect x="42" y="86" width="370" height="242" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="62" y="115" class="h">First-stage retrieval</text><text x="62" y="145" class="x">1. EC2 CPU triage</text><text x="356" y="145" class="s">0.84</text><text x="62" y="175" class="x">2. RDS CPU troubleshooting</text><text x="356" y="175" class="bad">0.82</text><text x="62" y="205" class="x">3. EC2 owner approval</text><text x="356" y="205" class="s">0.78</text><text x="62" y="235" class="x">4. EC2 autoscaling guide</text><text x="356" y="235" class="s">0.76</text><text x="62" y="284" class="s">Broad question-to-chunk similarity</text>
  <text x="454" y="188" class="h">exact question</text><text x="470" y="213" class="s">+ each candidate</text><text x="512" y="256" class="h">↓</text>
  <rect x="590" y="86" width="368" height="242" rx="9" fill="#ecfdf5" stroke="#86efac"/><text x="610" y="115" class="h">After reranking</text><text x="610" y="145" class="x">1. EC2 CPU triage</text><text x="610" y="175" class="x">2. EC2 owner approval</text><text x="610" y="205" class="x">3. EC2 autoscaling guide</text><text x="610" y="235" class="x">4. RDS CPU troubleshooting</text><text x="610" y="284" class="s">Question-specific relevance order</text>
  <text x="42" y="370" class="s">Relevant document ranked #25 while initial K = 10? The reranker never sees it, so it cannot recover it.</text>
</svg>
