<ol class="al-flow{% if include.plane == 'control' %} al-flow--control{% endif %}" style="--al-steps:{{ include.steps | size }}" aria-label="{{ include.label | escape }}">{%- for step in include.steps -%}<li><div class="al-node" data-kind="{{ step.kind }}"><span class="al-trust">{{ step.boundary }}</span><strong><span class="al-number">{{ forloop.index }}</span>{{ step.title }}</strong>{% if step.detail != '' %}<span class="al-node-copy">{{ step.detail }}</span>{% endif %}</div>{% unless forloop.last %}<div class="al-transfer" data-kind="{{ step.outKind | default: step.kind }}"><span aria-hidden="true">→</span><span>{{ step.out }}</span></div>{% endunless %}</li>{%- endfor -%}</ol>
