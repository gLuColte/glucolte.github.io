<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Token probability distribution before and after lowering temperature</title>
  <desc id="description">Grouped bar chart comparing token probabilities at temperature 1.0 and temperature 0.5. Lower temperature increases AWS from 50 to 73.4 percent and decreases the probabilities of the other tokens.</desc>

  <rect width="900" height="500" rx="18" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Lower temperature sharpens the distribution</text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">The likely token becomes more dominant; unlikely tokens become less likely.</text>

  <rect x="292" y="88" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="316" y="101" font-family="Arial, sans-serif" font-size="14" fill="#334155">Temperature 1.0</text>
  <rect x="458" y="88" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="482" y="101" font-family="Arial, sans-serif" font-size="14" fill="#334155">Temperature 0.5</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="110" y1="360" x2="820" y2="360"/>
    <line x1="110" y1="300" x2="820" y2="300" stroke-dasharray="4 5"/>
    <line x1="110" y1="240" x2="820" y2="240" stroke-dasharray="4 5"/>
    <line x1="110" y1="180" x2="820" y2="180" stroke-dasharray="4 5"/>
    <line x1="110" y1="120" x2="820" y2="120" stroke-dasharray="4 5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="end">
    <text x="98" y="365">0%</text>
    <text x="98" y="305">20%</text>
    <text x="98" y="245">40%</text>
    <text x="98" y="185">60%</text>
    <text x="98" y="125">80%</text>
  </g>
  <text x="28" y="240" transform="rotate(-90 28 240)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Probability</text>

  <g>
    <rect x="142" y="210" width="34" height="150" rx="4" fill="#3b82f6"/>
    <rect x="182" y="140" width="34" height="220" rx="4" fill="#f97316"/>
    <rect x="282" y="285" width="34" height="75" rx="4" fill="#3b82f6"/>
    <rect x="322" y="305" width="34" height="55" rx="4" fill="#f97316"/>
    <rect x="422" y="315" width="34" height="45" rx="4" fill="#3b82f6"/>
    <rect x="462" y="340" width="34" height="20" rx="4" fill="#f97316"/>
    <rect x="562" y="339" width="34" height="21" rx="4" fill="#3b82f6"/>
    <rect x="602" y="356" width="34" height="4" rx="2" fill="#f97316"/>
    <rect x="702" y="351" width="34" height="9" rx="4" fill="#3b82f6"/>
    <rect x="742" y="358" width="34" height="2" rx="1" fill="#f97316"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <text x="159" y="201" fill="#2563eb">50%</text>
    <text x="199" y="131" fill="#c2410c">73.4%</text>
    <text x="299" y="276" fill="#2563eb">25%</text>
    <text x="339" y="296" fill="#c2410c">18.3%</text>
    <text x="439" y="306" fill="#2563eb">15%</text>
    <text x="479" y="331" fill="#c2410c">6.6%</text>
    <text x="579" y="330" fill="#2563eb">7%</text>
    <text x="619" y="347" fill="#c2410c">1.4%</text>
    <text x="719" y="342" fill="#2563eb">3%</text>
    <text x="759" y="349" fill="#c2410c">0.3%</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">
    <text x="179" y="389">AWS</text>
    <text x="319" y="389">Azure</text>
    <text x="459" y="389">Google</text>
    <text x="599" y="389">Oracle</text>
    <text x="739" y="389">IBM</text>
  </g>

  <rect x="110" y="420" width="710" height="48" rx="8" fill="#e2e8f0"/>
  <text x="465" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Temperature changes probabilities; it does not select or remove tokens.</text>
  <text x="465" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Top-p uses the resulting orange distribution to create the candidate set.</text>
</svg>
